<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Blue Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="50%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Decorative Gold Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Shield Shape (Classic Law College Symbol) -->
  <path d="M 100,35 L 145,50 L 145,95 Q 145,125 100,145 Q 55,125 55,95 L 55,50 Z" 
        fill="white" opacity="0.96" filter="url(#shadow)"/>
  
  <!-- Gold Banner Across Shield -->
  <rect x="50" y="75" width="100" height="20" rx="3" fill="url(#goldGradient)" filter="url(#glow)"/>
  
  <!-- Letter "A" in Shield (Abbott) -->
  <text x="100" y="67" font-family="Georgia, Times, serif" font-size="28" font-weight="bold" 
        fill="#1e3a8a" text-anchor="middle" dominant-baseline="middle" letter-spacing="1">ABBOTT</text>
  
  <!-- Justice Scales Icon -->
  <g transform="translate(100, 110)" filter="url(#glow)">
    <!-- Center Pillar -->
    <rect x="-2.5" y="-5" width="5" height="25" rx="1.5" fill="url(#goldGradient)"/>
    
    <!-- Scale Beam -->
    <rect x="-22" y="-7" width="44" height="4" rx="2" fill="url(#goldGradient)"/>
    
    <!-- Left Chain -->
    <line x1="-20" y1="-5" x2="-20" y2="5" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Right Chain -->
    <line x1="20" y1="-5" x2="20" y2="5" stroke="#f59e0b" stroke-width="1.5"/>
    
    <!-- Left Scale Pan -->
    <path d="M -26,5 L -14,5 L -15,10 L -25,10 Z" fill="#1e3a8a" opacity="0.9"/>
    
    <!-- Right Scale Pan -->
    <path d="M 14,5 L 26,5 L 25,10 L 15,10 Z" fill="#1e3a8a" opacity="0.9"/>
    
    <!-- Base -->
    <rect x="-9" y="20" width="18" height="5" rx="2" fill="url(#goldGradient)"/>
  </g>
  
  <!-- Laurel Wreath Left Side -->
  <path d="M 45,85 Q 40,82 42,78 Q 44,82 45,85 M 40,80 Q 35,77 37,73 Q 39,77 40,80 M 35,75 Q 30,72 32,68 Q 34,72 35,75" 
        fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Laurel Wreath Right Side -->
  <path d="M 155,85 Q 160,82 158,78 Q 156,82 155,85 M 160,80 Q 165,77 163,73 Q 161,77 160,80 M 165,75 Q 170,72 168,68 Q 166,72 165,75" 
        fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Bottom Text: LAW COLLEGE -->
  <text x="100" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" 
        fill="white" text-anchor="middle" letter-spacing="2">LAW COLLEGE</text>
  
  <!-- Sub Text: MANSEHRA -->
  <text x="100" y="175" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="600" 
        fill="white" text-anchor="middle" letter-spacing="1.5" opacity="0.9">MANSEHRA</text>
</svg>